name: SonarQube

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download JUnit
        run: |
          mkdir -p libs
          curl -L -o libs/junit-4.13.2.jar https://search.maven.org/remotecontent?filepath=junit/junit/4.13.2/junit-4.13.2.jar
          curl -L -o libs/hamcrest-core-1.3.jar https://search.maven.org/remotecontent?filepath=org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Compile main sources (javac)
        run: |
          SRC_DIR="javacatan/src-sim"
          OUT_DIR="javacatan/bin"
          mkdir -p "$OUT_DIR"

          find "$SRC_DIR" -name "*.java" \
            ! -path "*/catansim/Task1/*" \
            ! -path "*/catansim/Task3UnitTests/*" \
            > sources.txt

          echo "Compiling main files:"
          cat sources.txt

          if [ ! -s sources.txt ]; then
            echo "No .java files found under $SRC_DIR after exclusions"
            exit 1
          fi

          javac -encoding UTF-8 -d "$OUT_DIR" @sources.txt

      - name: Compile tests
        run: |
          TEST_OUT="javacatan/bin"
          find javacatan/src-sim/catansim/Task1 javacatan/src-sim/catansim/Task3UnitTests -name "*.java" > test-sources.txt

          echo "Compiling test files:"
          cat test-sources.txt

          if [ ! -s test-sources.txt ]; then
            echo "No test .java files found"
            exit 1
          fi

          javac -encoding UTF-8 -cp "javacatan/bin:libs/*" -d "$TEST_OUT" @test-sources.txt

      - name: Run JUnit tests
        run: |
          TEST_CLASSES=$(find javacatan/bin -name "*Test.class" -o -name "AllTests.class" \
            | sed 's#javacatan/bin/##' \
            | sed 's#/#.#g' \
            | sed 's/\.class$//')

          echo "Running tests:"
          echo "$TEST_CLASSES"

          java -cp "javacatan/bin:libs/*" org.junit.runner.JUnitCore $TEST_CLASSES

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
